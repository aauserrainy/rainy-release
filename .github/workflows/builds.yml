name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests cryptography pyautogui pygetwindow

      - name: Create admin manifest
        run: |
          echo '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>' > admin.manifest

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --name "RainyInstaller" --manifest admin.manifest installer.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RainyInstaller
          path: dist/RainyInstaller.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rainy Installer Latest
          files: dist/RainyInstaller.exe
          token: ${{ secrets.GITHUB_TOKEN }}
